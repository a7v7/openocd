# =============================================================================
# ftdi_kc705_rv32_gdb.cfg
# Trilinear RV32-IM core on the KC705, through the FT4232H on the LeafLabs
# RISC-V breakout card (FMC LPC, REV A) instead of a J-Link.
#
# Card wiring (schematic Trilinear_RISCV_Breakout-REV-A, sheets 2 and 7):
#   FT4232H channel A (MPSSE): ADBUS0 TCK, ADBUS1 TDI, ADBUS2 TDO, ADBUS3 TMS
#   -> JTAG switch U11 (SN74CB3Q3257); jumper J8 (JTAG_SEL) picks the FTDI
#   (B1 side) or the external MIPI header J2/J3 (B2 side, the J-Link).
#   nTRST, nRESET and RTCK go to the external header only: no reset lines here.
#   Channel B is SPI, channels C and D are UART1 / UART2 (COM ports).
#
# Windows: OpenOCD reaches channel A through libusb, so interface 0 of the
# FT4232H needs the WinUSB driver (Zadig, "Quad RS232-HS (Interface 0)");
# leave interfaces 2 and 3 on the FTDI driver so the UARTs stay COM ports.
#
# Usage (from the openocd tree):
#   src/openocd.exe -s tcl -f board/trilinear/ftdi_kc705_rv32_gdb.cfg
# =============================================================================

adapter driver ftdi
ftdi vid_pid 0x0403 0x6011
ftdi channel 0
# TMS high; TCK, TDI, TMS outputs (ADBUS0, 1, 3); TDO input (ADBUS2)
ftdi layout_init 0x0008 0x000b

source [find target/trilinear/riscv_rv32-im.cfg]
