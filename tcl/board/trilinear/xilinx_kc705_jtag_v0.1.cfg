# =============================================================================
# trilin_jtag_v0.1.cfg
# Trilinear RV32-IM Core — Low-Level JTAG Bring-Up Script
#
# Purpose:
#   Provides a controlled, defect-tolerant JTAG connection to the Trilinear
#   custom RV32-IM core.  The core has a known defect that causes TDO bits
#   to stick after the IDCODE register is shifted out, which causes the
#   standard OpenOCD automatic scan-chain validation (jtag arp_init /
#   jtag arp_init-reset) to fail.
#
#   This script works around that defect by:
#     1. Suppressing automatic IDCODE verification in the TAP declaration.
#     2. Overriding jtag_init to prevent any automatic scan-chain check.
#     3. Manually reading IDCODE via raw irscan/drscan and verifying it
#        matches the expected value (0x15150DBB).
#     4. Confirming the TAP irlen is 5 bits (already declared; shown
#        explicitly via scan_chain for visual confirmation).
#     5. Examining the target and opening a path to DM access via the
#        riscv dmi_read / riscv dmi_write commands.
#
# RISC-V JTAG IR values (RISC-V Debug Spec 0.13, §6.1):
#   IDCODE  = 0x01  (5-bit IR: 00001)
#   DTMCS   = 0x10  (5-bit IR: 10000)  — DTM Control & Status
#   DMI     = 0x11  (5-bit IR: 10001)  — Debug Module Interface
#   BYPASS  = 0x1f  (5-bit IR: 11111)  — JTAG mandatory all-ones
#
# DMI register addresses of interest (RISC-V Debug Spec 0.13, §3.12):
#   dmcontrol  = 0x10
#   dmstatus   = 0x11
#   abstractcs = 0x16
#   data0      = 0x04
#
# Usage:
#   openocd -f trilin_jtag_v0.1.cfg
#   openocd -f trilin_jtag_v0.1.cfg -c "init" -c "trilin_idcode_check" ...
#
# Adapter:
#   Edit the "ADAPTER CONFIGURATION" section below for your hardware.
#   A Digilent HS2 / FTDI-based probe is shown as the default example.
#   Substitute your actual interface .cfg as needed.
#
# Version history:
#   v0.1  — Initial bring-up script.  Manual IDCODE verify, DM entry.
#
# References:
#   OpenOCD User's Guide 0.12.0+dev, §7.2, §9.3, §9.4, §10.3, §17.1,
#   §16.11.4, §16.11.6
#   RISC-V Debug Specification v0.13.2
# =============================================================================


# =============================================================================
# ADAPTER CONFIGURATION
# Edit this section for your physical debug probe.
# =============================================================================

# --- Option A: Digilent HS2 (FTDI-based) — default for Trilinear bringup ---
# source [find interface/ftdi/digilent-hs2.cfg]

# --- Option B: FTDI FT2232H mini-module ---
# source [find interface/ftdi/ft2232h_module_ftdi.cfg]

# --- Option C: J-Link ---
adapter driver jlink

# --- Option D: CMSIS-DAP ---
# adapter driver cmsis-dap

# Force JTAG transport regardless of adapter default
transport select jtag

# Start very slow — the core is defective and may not tolerate fast clocks
# at this bring-up stage.  500 kHz is conservative; increase if proven stable.
adapter speed 500

# No SRST or TRST wired on the Trilinear eval board.
# Using "none" prevents OpenOCD from attempting to drive reset lines that
# don't exist, which could otherwise interfere with the manual bring-up flow.
# (OpenOCD User's Guide §9.3: reset_config signals)
reset_config none


# =============================================================================
# TAP DECLARATION
# (OpenOCD User's Guide §10.3)
#
# Key choices and rationale:
#
#   -irlen 5
#       The Trilinear RV32-IM DTM uses a 5-bit instruction register per the
#       RISC-V Debug Spec 0.13.  Declaring it explicitly skips the IR-length
#       discovery phase of autoprobing.
#
#   -expected-id 0
#       Setting expected-id to zero suppresses all IDCODE mismatch warnings
#       and prevents arp_init from comparing the hardware IDCODE against any
#       stored value.  We perform our own verified IDCODE read manually below.
#       (§10.3: "Specify number as zero to suppress warnings about IDCODE
#       values that were found but not included in the list.")
#
#   -ignore-version
#       Masks bits [31:28] (the version field) as a secondary precaution
#       against false IDCODE match failures on silicon respins.
#
#   -ignore-bypass
#       The Trilinear core's stuck-TDO defect can make the bypass bit look
#       invalid.  This flag prevents OpenOCD from misclassifying the TAP as
#       being in bypass when it is not.  (§10.3)
#
#   -ircapture 0x01 / -irmask 0x03
#       Standard JTAG requirement: the two LSBs of IRCAPTURE must be 0b01.
#       Providing the minimal mask here avoids false IR scan failures.
# =============================================================================

set _CHIPNAME   trilinear
set _TARGETNAME $_CHIPNAME.cpu

jtag newtap $_CHIPNAME cpu  \
    -irlen       5          \
    -expected-id 0          \
    -ignore-version         \
    -ignore-bypass          \
    -ircapture   0x01       \
    -irmask      0x03


# =============================================================================
# TARGET DECLARATION
# (OpenOCD User's Guide §11, §16.11)
#
#   -chain-position $_TARGETNAME
#       Binds this target to the TAP declared above.
#
#   -defer-examine
#       Prevents OpenOCD from automatically calling arp_examine at init time.
#       We call it manually after IDCODE verification so we have full control
#       over the sequence.  (§11: "-defer-examine: skip target examination at
#       initial JTAG chain scan ... A manual call to arp_examine is required.")
# =============================================================================

target create $_TARGETNAME riscv  \
    -chain-position $_TARGETNAME  \
    -defer-examine


# =============================================================================
# OVERRIDE jtag_init
# (OpenOCD User's Guide §7.2, §9.4)
#
# jtag_init is an overridable Tcl procedure that fires during the transition
# from configuration stage to run stage.  Its default implementation calls
# jtag arp_init, which performs full scan-chain validation (IDCODE check +
# IR length verification).  That validation fails against the Trilinear core
# because of the stuck-TDO defect.
#
# By replacing jtag_init with a no-op we prevent the automatic validation
# entirely.  All verification is done explicitly in trilin_idcode_check below.
#
# Reference: "Experiment with lower level operations ... to find a sequence
# of operations that works.  When you find a working sequence, it can be used
# to override jtag_init, which fires during OpenOCD startup."  (§9.4)
# =============================================================================

proc jtag_init {} {
    echo ""
    echo "--------------------------------------------------------------------"
    echo "  trilin_jtag: jtag_init OVERRIDDEN"
    echo "  Automatic scan-chain validation is suppressed."
    echo "  Workaround for Trilinear RV32 stuck-TDO defect post-IDCODE read."
    echo "  Call trilin_idcode_check to perform manual IDCODE verification."
    echo "--------------------------------------------------------------------"
    echo ""
    # Intentionally do NOT call jtag arp_init or jtag arp_init-reset here.
}


# =============================================================================
# VERIFY DISABLE
# (OpenOCD User's Guide §17.1)
#
# verify_ircapture and verify_jtag control whether OpenOCD cross-checks the
# contents of IR and DR shift registers against expected values after each
# scan.  With the Trilinear stuck-TDO defect these checks will fire false
# positives.  Disable them globally for this script so raw irscan/drscan
# calls succeed even while the defect is present.
# =============================================================================

verify_ircapture disable
verify_jtag      disable


# =============================================================================
# PROCEDURE: trilin_idcode_check
#
# Performs a manual, raw JTAG IDCODE read and verifies the result.
#
# Sequence:
#   1. Load IDCODE instruction (0x01) into the 5-bit IR via irscan.
#      Leave the TAP in IRPAUSE so we can transition directly to DR shift
#      without returning to RUN/IDLE (avoids an unnecessary RUN/IDLE
#      clock edge that could re-trigger the stuck-TDO condition).
#   2. Shift 32 bits out of the DR (the IDCODE register) via drscan.
#      TDI is driven all-zeros; we only care about TDO.
#   3. Compare the returned value against 0x15150dbb.
#   4. Report PASS or FAIL with explicit hex values.
#
# Returns:
#   1 on PASS, calls error on FAIL.
#
# (OpenOCD User's Guide §17.1: irscan, drscan)
# =============================================================================

proc trilin_idcode_check {} {
    set expected_idcode "15150dbb"

    echo ""
    echo "--------------------------------------------------------------------"
    echo "  trilin_idcode_check: Loading IDCODE instruction (IR=0x01)"
    echo "--------------------------------------------------------------------"

    # Load IDCODE instruction into 5-bit IR.
    # End state: IRPAUSE — avoids RUN/IDLE between IR and DR scans.
    irscan trilinear.cpu 0x01 -endstate IRPAUSE

    echo "  IR scan complete.  Shifting IDCODE DR (32 bits)..."

    # Shift 32-bit IDCODE DR.  TDI = 0x00000000 (don't care for read).
    # End state: RUN/IDLE — standard resting state after a DR scan.
    set raw [drscan trilinear.cpu 32 0x00000000 -endstate RUN/IDLE]

    # drscan returns a list of hex fields, one per field specified.
    # We specified one 32-bit field, so raw is a single hex string.
    set idcode [lindex $raw 0]

    echo ""
    echo "  IDCODE read  : 0x$idcode"
    echo "  IDCODE expect: 0x$expected_idcode"

    if { [string equal -nocase $idcode $expected_idcode] } {
        echo ""
        echo "  *** IDCODE PASS: 0x15150DBB verified ***"
        echo ""
        return 1
    } else {
        echo ""
        echo "  *** IDCODE FAIL: got 0x$idcode, expected 0x$expected_idcode ***"
        echo ""
        error "IDCODE mismatch — aborting.  Check TDO signal integrity."
    }
}


# =============================================================================
# PROCEDURE: trilin_tap_confirm
#
# Displays the scan chain state via scan_chain, confirming irlen=5 and
# the TAP name as declared.  Purely informational.
#
# (OpenOCD User's Guide §10.1: scan_chain command)
# =============================================================================

proc trilin_tap_confirm {} {
    echo ""
    echo "--------------------------------------------------------------------"
    echo "  trilin_tap_confirm: Scan chain declaration"
    echo "  irlen should read 5 for trilinear.cpu"
    echo "--------------------------------------------------------------------"
    scan_chain
    echo ""
}


# =============================================================================
# PROCEDURE: trilin_dm_init
#
# Initiates DM access after IDCODE has been verified.
#
# Steps:
#   1. Call $_TARGETNAME arp_examine to let OpenOCD probe the DTM/DM.
#      This is the deferred examination we skipped at init time.
#      If the core's defect prevents arp_examine from completing, proceed
#      to the manual DMI fallback below.
#   2. Read dmstatus (DMI 0x11) and dmcontrol (DMI 0x10) to confirm DM
#      is reachable and report its state.
#   3. Assert dmactive in dmcontrol (bit 0) to activate the DM.
#
# DMI register map (RISC-V Debug Spec 0.13 §3.12):
#   0x10  dmcontrol   — DM control register
#   0x11  dmstatus    — DM status (version, anyhalted, allhalted, etc.)
#   0x16  abstractcs  — Abstract command status
#
# (OpenOCD User's Guide §16.11.6: riscv dmi_read, riscv dmi_write)
# (OpenOCD User's Guide §16.11: $target_name arp_examine)
# =============================================================================

proc trilin_dm_init {} {
    global _TARGETNAME

    echo ""
    echo "--------------------------------------------------------------------"
    echo "  trilin_dm_init: Examining target and entering DM"
    echo "--------------------------------------------------------------------"

    # Attempt deferred target examination.
    # arp_examine probes the DTM via the RISC-V JTAG Debug Transport Module:
    # it reads DTMCS to determine abits (DMI address width) and the debug
    # spec version, then reads dmstatus to characterise the DM.
    echo "  Calling arp_examine on $_TARGETNAME ..."
    if { [catch { $_TARGETNAME arp_examine } err] } {
        echo ""
        echo "  WARNING: arp_examine failed: $err"
        echo "  The core defect may be blocking DTM access at this stage."
        echo "  Falling through to manual DMI access below."
        echo "  If dmi_read also fails, check TDO signal integrity after"
        echo "  IDCODE shift and confirm the defect reproduction conditions."
        echo ""
    } else {
        echo "  arp_examine succeeded."
    }

    # --- Read dmstatus (DMI address 0x11) ---
    echo ""
    echo "  Reading dmstatus  (DMI 0x11) ..."
    if { [catch { set dmstatus [riscv dmi_read 0x11] } err] } {
        echo "  dmstatus read FAILED: $err"
    } else {
        echo "  dmstatus  = 0x[format %08x $dmstatus]"
        # Decode key fields for diagnostic output
        set version    [expr { $dmstatus & 0x0f }]
        set anyhalted  [expr { ($dmstatus >> 8)  & 1 }]
        set allhalted  [expr { ($dmstatus >> 9)  & 1 }]
        set anyrunning [expr { ($dmstatus >> 10) & 1 }]
        set impebreak  [expr { ($dmstatus >> 22) & 1 }]
        echo "    version    = $version  (1=0.11, 2=0.13, 3=1.0)"
        echo "    anyhalted  = $anyhalted"
        echo "    allhalted  = $allhalted"
        echo "    anyrunning = $anyrunning"
        echo "    impebreak  = $impebreak"
    }

    # --- Read dmcontrol (DMI address 0x10) ---
    echo ""
    echo "  Reading dmcontrol (DMI 0x10) ..."
    if { [catch { set dmcontrol [riscv dmi_read 0x10] } err] } {
        echo "  dmcontrol read FAILED: $err"
    } else {
        echo "  dmcontrol = 0x[format %08x $dmcontrol]"
        set dmactive   [expr { $dmcontrol & 1 }]
        set ndmreset   [expr { ($dmcontrol >> 1) & 1 }]
        echo "    dmactive  = $dmactive  (0=DM not active, 1=DM active)"
        echo "    ndmreset  = $ndmreset"
    }

    # --- Assert dmactive (DMI 0x10 bit 0) ---
    # Writing 1 to dmactive activates the DM.  This is required before
    # issuing any abstract commands or halting the hart.
    echo ""
    echo "  Asserting dmactive (writing 0x00000001 to dmcontrol DMI 0x10) ..."
    if { [catch { riscv dmi_write 0x10 0x00000001 } err] } {
        echo "  dmcontrol write FAILED: $err"
    } else {
        echo "  dmactive asserted."
    }

    # --- Read back dmstatus post-dmactive ---
    echo ""
    echo "  Re-reading dmstatus post-dmactive (DMI 0x11) ..."
    if { [catch { set dmstatus2 [riscv dmi_read 0x11] } err] } {
        echo "  dmstatus re-read FAILED: $err"
    } else {
        echo "  dmstatus  = 0x[format %08x $dmstatus2]"
        set authenticated [expr { ($dmstatus2 >> 7) & 1 }]
        echo "    authenticated = $authenticated  (1=debug access allowed)"
    }

    # --- Read abstractcs (DMI address 0x16) ---
    echo ""
    echo "  Reading abstractcs (DMI 0x16) ..."
    if { [catch { set abstractcs [riscv dmi_read 0x16] } err] } {
        echo "  abstractcs read FAILED: $err"
    } else {
        echo "  abstractcs = 0x[format %08x $abstractcs]"
        set progbufsize [expr { ($abstractcs >> 24) & 0x1f }]
        set busy        [expr { ($abstractcs >> 12) & 1 }]
        set cmderr      [expr { ($abstractcs >> 8)  & 0x07 }]
        set datacount   [expr { $abstractcs & 0x0f }]
        echo "    progbufsize = $progbufsize  (program buffer words)"
        echo "    busy        = $busy"
        echo "    cmderr      = $cmderr  (0=no error)"
        echo "    datacount   = $datacount  (data registers available)"
    }

    echo ""
    echo "  trilin_dm_init complete."
    echo "  Use 'riscv dmi_read <addr>' and 'riscv dmi_write <addr> <val>'"
    echo "  for further direct DM access."
    echo "--------------------------------------------------------------------"
    echo ""
}


# =============================================================================
# PROCEDURE: trilin_connect
#
# Top-level convenience procedure.  Runs the full manual bring-up sequence:
#   1. trilin_idcode_check  — verify IDCODE = 0x15150DBB
#   2. trilin_tap_confirm   — display scan chain / irlen
#   3. trilin_dm_init       — examine target, enter DM, read key registers
#
# Call this from the OpenOCD telnet/TCL port after init:
#   > trilin_connect
# =============================================================================

proc trilin_connect {} {
    echo ""
    echo "===================================================================="
    echo "  Trilinear RV32-IM JTAG Bring-Up  —  trilin_jtag_v0.1.cfg"
    echo "===================================================================="

    trilin_idcode_check
    trilin_tap_confirm
    trilin_dm_init

    echo "===================================================================="
    echo "  trilin_connect complete."
    echo "===================================================================="
    echo ""
}


# =============================================================================
# ENTRY POINT
#
# init transitions from configuration stage to run stage.  Because jtag_init
# has been overridden above, this does NOT trigger any automatic scan-chain
# validation.  All JTAG activity is deferred to the explicit procedure calls
# that follow.
#
# (OpenOCD User's Guide §7.2: "This command terminates the configuration
# stage and enters the run stage.")
# =============================================================================

init

# Run the full manual bring-up sequence immediately on startup.
trilin_connect
