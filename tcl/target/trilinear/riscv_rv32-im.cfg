# =============================================================================
# riscv_rv32-im.cfg
# Trilinear RV32-IM Core — OpenOCD Target Configuration
#
# Purpose:
#   Provides a controlled, defect-tolerant JTAG connection to the Trilinear
#   custom RV32-IM core.  The core has a known defect that causes TDO bits
#   to stick after the IDCODE register is shifted out, which causes the
#   standard OpenOCD automatic scan-chain validation (jtag arp_init /
#   jtag arp_init-reset) to fail.
#
#   This script works around that defect by:
#     1. Suppressing automatic IDCODE verification in the TAP declaration.
#     2. Overriding jtag_init to prevent any automatic scan-chain check.
#     3. Manually reading IDCODE via raw irscan/drscan and verifying it
#        matches the expected value (0x15150DBB).
#     4. Confirming the TAP irlen is 5 bits (already declared; shown
#        explicitly via scan_chain for visual confirmation).
#     5. Examining the target and opening a path to DM access via the
#        riscv dmi_read / riscv dmi_write commands.
#
#   Additional workarounds for the Trilinear RV32-IM DM implementation:
#     - progbufsize=0: The DM has no program buffer.  Memory access is
#       forced to abstract-commands-only via riscv set_mem_access.
#     - No FPU: The core is RV32-IM with no F/D extension.  OpenOCD's
#       examine logic attempts to read FP CSRs (0x001-0x003) via the
#       program buffer even when progbufsize=0, causing a spurious
#       "Unexpected read of fp via program buffer" error that prevents
#       examine from completing.  These CSRs are hidden before init via
#       riscv hide_csrs, which is a config-stage-only command.
#
# RISC-V JTAG IR values (RISC-V Debug Spec 0.13, §6.1):
#   IDCODE  = 0x01  (5-bit IR: 00001)
#   DTMCS   = 0x10  (5-bit IR: 10000)  — DTM Control & Status
#   DMI     = 0x11  (5-bit IR: 10001)  — Debug Module Interface
#   BYPASS  = 0x1f  (5-bit IR: 11111)  — JTAG mandatory all-ones
#
# DMI register addresses of interest (RISC-V Debug Spec 0.13, §3.12):
#   dmcontrol  = 0x10
#   dmstatus   = 0x11
#   abstractcs = 0x16
#   data0      = 0x04
#
# Usage:
#   openocd -f interface/jlink.cfg -f target/trilinear/riscv_rv32-im.cfg
#
# Version history:
#   v0.1  — Initial bring-up script.  Manual IDCODE verify, DM entry.
#   v0.2  — Hide FP CSRs before init (riscv hide_csrs, config-stage only).
#            Force abstract-only memory access (riscv set_mem_access abstract).
#            Remove catch wrapper around arp_examine so failures are visible.
#   v0.3  — Restructured as a proper target cfg (interface-agnostic).
#            IDCODE and IR length filled in from confirmed hardware values.
#   v0.4  — Restart the core at the end of jtag_init().
#            Add handlers for gdb-attach and db-detach.
#
# References:
#   OpenOCD User's Guide 0.12.0+dev, §7.2, §9.3, §9.4, §10.3, §17.1,
#   §16.11.4, §16.11.6
#   RISC-V Debug Specification v0.13.2
# =============================================================================

set _CHIPNAME trilinear-rv32im
set _EXPECTED_ID 0x15150dbb

transport select jtag
adapter speed 1000

# -----------------------------------------------------------------------------
# TAP declaration
#
# -ignore-version: suppresses IDCODE version-field mismatches (upper 4 bits).
# The TDO-sticky defect means automatic scan-chain validation is unreliable;
# we do a manual IDCODE check in jtag_init instead.
# -----------------------------------------------------------------------------
jtag newtap $_CHIPNAME cpu \
    -irlen 5 \
    -expected-id $_EXPECTED_ID \
    -ignore-version

set _TARGETNAME $_CHIPNAME.cpu

# -----------------------------------------------------------------------------
# Target creation
# -----------------------------------------------------------------------------
target create $_TARGETNAME riscv -chain-position $_CHIPNAME.cpu

# -----------------------------------------------------------------------------
# RISC-V options (config stage — must be set before init)
#
# set_xlen 32: force XLEN to 32 instead of auto-detecting it.  The DM
#   incorrectly accepts a 64-bit abstract command (AARSIZE=3) on this 32-bit
#   core without returning cmderr=2, violating Debug Spec 0.13 §3.5.1.
#   Without this, examine_xlen() concludes XLEN=64 and all subsequent
#   register abstract commands use 64-bit width.
#
# set_mem_access abstract: force all memory access through abstract commands
#   only.  This core has progbufsize=0 so progbuf-based access cannot work.
#
# hide_csrs: suppress FP CSR probing during examine.  This is an RV32-IM
#   core with no F/D extension; attempting to read mstatus.FS or fcsr via
#   abstract command causes spurious errors during examine.
# -----------------------------------------------------------------------------
$_TARGETNAME riscv set_xlen 32
$_TARGETNAME riscv set_mem_access abstract
$_TARGETNAME riscv hide_csrs 0x001-0x003

$_TARGETNAME configure -event gdb-attach { halt }
$_TARGETNAME configure -event gdb-detach { resume }

proc jtag_init {} {
    global _CHIPNAME _EXPECTED_ID

    adapter deassert trst deassert srst

    # Shift in IDCODE instruction and capture 32-bit DR
    irscan $_CHIPNAME.cpu 0x01
    set idcode [drscan $_CHIPNAME.cpu 32 0x00000000]
    set idcode 0x[string toupper $idcode]

    if {$idcode != [string toupper [format "0x%08X" $_EXPECTED_ID]]} {
        error [format "IDCODE mismatch: got %s, expected 0x%08X" \
            $idcode $_EXPECTED_ID]
    }

    echo [format "Trilinear RV32-IM: IDCODE verified: %s" $idcode]

    # -------------------------------------------------------------------------
    # Abstract command engine wake-up sequence
    #
    # On first power-on, the abstract command engine refuses the first command
    # issued after dmactive assertion, returning cmderr=2 (not supported).
    # The engine operates correctly after one failed-and-cleared cmderr cycle.
    #
    # Workaround: issue a sacrificial misa read, then clear cmderr via W1C
    # write to abstractcs before OpenOCD's examine begins.
    #
    # DMI frame layout (abits=8, 42-bit frame):
    #   [41:34] addr  [33:2] data  [1:0] op (0=NOP 1=READ 2=WRITE)
    # -------------------------------------------------------------------------

    # Select DMI
    irscan $_CHIPNAME.cpu 0x11

    # Assert dmactive
    # dmcontrol (0x10) = 0x00000001
    drscan $_CHIPNAME.cpu 42 0x04000000006
    drscan $_CHIPNAME.cpu 42 0x00000000000 ;# NOP to clock result

    # Assert haltreq
    # dmcontrol (0x10) = 0x80000001
    drscan $_CHIPNAME.cpu 42 0x04200000006
    drscan $_CHIPNAME.cpu 42 0x00000000000 ;# NOP to clock result

    # Sacrificial misa read — expected to fail with cmderr=2
    # command (0x17) = 0x00220301  (AccessRegister, aarsize=2, read misa)
    drscan $_CHIPNAME.cpu 42 0x05C00880C06
    drscan $_CHIPNAME.cpu 42 0x00000000000 ;# NOP to clock result

    # Clear cmderr via W1C write to abstractcs (0x16) = 0x00000700
    drscan $_CHIPNAME.cpu 42 0x05800001C02
    drscan $_CHIPNAME.cpu 42 0x00000000000 ;# NOP to clock result

    echo "Trilinear RV32-IM: abstract command engine primed"

	# Assert resumereq
	# dmcontrol (0x10) = 0x40000001
	drscan $_CHIPNAME.cpu 42 0x04100000006
	drscan $_CHIPNAME.cpu 42 0x00000000000 ;# NOP to clock result

	echo "Trilinear RV32-IM: core resumed"
}
